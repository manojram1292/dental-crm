<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: 'EB Garamond', Georgia, serif; }
  body { padding: 16px; }
  canvas { display: block; width: 100%; height: auto; max-width: 1600px; margin: 0 auto; }
  body.render { padding: 0; }
  body.render canvas { max-width: none; width: auto; }
  p { max-width: 1600px; margin: 0 auto 12px; color: var(--mute); font-size: 15px; }
  body.render p { display: none; }

<body>
<p>Mahabharatam — As Vyasa Told It · character bible (src/kit/characters/, CHARACTERS.md). Every figure is drawn by its module's single draw(ctx, opts); only pose, facing, scale, light and expression change.</p>

<script>
(async function () {
  'use strict';
  const R = window.REEL, KIT = window.KIT, CH = KIT.characters;
  const q = new URLSearchParams(location.search);
  if (q.get('render') === '1') document.body.classList.add('render');
  R.scale = 1;
  await Promise.all(["600 40px 'Cinzel'", "500 24px 'EB Garamond'", "italic 500 24px 'EB Garamond'"].map((f) => document.fonts.load(f)));

  // ?solo=<id>: one character large, in every pose (close-up check)
  const solo = q.get('solo');
  if (solo) {
    const mod = CH[solo];
    const poses = (mod.bible.poses || []).map((p) => p.name);
    const cv = document.getElementById('sheet');
    cv.width = poses.length * 520; cv.height = 1300;
    const g = cv.getContext('2d');
    g.fillStyle = '#1c1410'; g.fillRect(0, 0, cv.width, cv.height);
    poses.forEach((name, i) => {
      const pose = { name, k: name === 'strike' ? 0.7 : name === 'descend' ? 0.3 : 1, phase: 1.1 };
      mod.draw(g, { x: i * 520 + 280, y: 1250, scale: +(q.get('scale') || 0.85), pose, facing: q.get('facing') || (solo === 'sage' || solo === 'pitr' ? 'front' : 'left'), index: i, light: CH.LIGHTS.key, expression: { mood: 'wrath' }, t: 0.6 });
      g.fillStyle = '#d8c09a'; g.font = '600 26px serif'; g.fillText(name, i * 520 + 30, 40);
    });
    window.__sheetReady = true;
    return;
  }
  const CAST = await (await fetch('../script/cast.json')).json();
  const S = 0.3;                           // one scale for everyone: heights compare
  const CW = 300, CH_ = 540, LEFT = 360, GAP = 18, HEAD = 64;
  const T0 = 0.6;
  // per character: poses to show (label, pose, expression, facing) and the pose used for the three lights
  const ROWS = [
    { id: 'sauti', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1, stride: 1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['speak · seated', { name: 'speak', base: 'sit', k: 1 }], ['bless', { name: 'bless', k: 1 }], ['bow', { name: 'bow', k: 1 }]], lightPose: 'stand' },
    { id: 'elder', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak · ask', { name: 'speak', k: 1 }, { speak: 0.8 }], ['speak · seated', { name: 'speak', base: 'sit', k: 1 }], ['bless', { name: 'bless', k: 1 }], ['bow', { name: 'bow', k: 1 }]], lightPose: 'stand' },
    { id: 'sage', frontal: true, poses: [['sit · 0', 'sit', null, 'front', 0], ['sit · 1', 'sit', null, 'front', 1], ['sit · 2', 'sit', null, 'front', 2], ['listen · 3', 'sit', { look: 0.8 }, 'front', 3], ['speak · 4', { name: 'speak', k: 1 }, null, 'front', 4], ['bless · 5', { name: 'bless', k: 1 }, null, 'front', 5], ['back · 6', 'sit', null, 'back', 6], ['stand · 7', 'stand', null, 'front', 7]], lightPose: 'sit', lightFront: 0.55 },
    { id: 'parashurama', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }], ['raise-axe', { name: 'raise-axe', k: 1 }, { mood: 'wrath' }], ['strike', { name: 'strike', k: 0.7 }, { mood: 'wrath' }], ['lower-axe', { name: 'lower-axe', k: 1 }, { mood: 'sorrow' }]], lightPose: { name: 'raise-axe', k: 1 } },
    { id: 'pitr', frontal: true, poses: [['stand · 0', 'stand', null, 'front', 0], ['walk · 1', { name: 'walk', phase: 1 }, null, 'front', 1], ['sit · 2', 'sit', null, 'front', 2], ['speak · 3', { name: 'speak', k: 1 }, null, 'front', 3], ['bless · 4', { name: 'bless', k: 1 }, null, 'front', 4], ['plead · 0', { name: 'plead', k: 1 }, null, 'front', 0], ['descend · 1', { name: 'descend', k: 0.3 }, null, 'front', 1]], lightPose: 'bless', lightFront: 0.3 },
    { id: 'vyasa', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['dictate · seated', { name: 'dictate', base: 'sit', k: 1 }], ['bless', { name: 'bless', k: 1 }]], lightPose: 'stand' },
    { id: 'janamejaya', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit · throne', 'sit'], ['speak · command', { name: 'speak', k: 1 }], ['offer', { name: 'offer', k: 1 }], ['bless', { name: 'bless', k: 1 }]], lightPose: 'stand' },
    { id: 'ganesha', poses: [['stand', 'stand'], ['sit', 'sit'], ['write', { name: 'write', k: 1, phase: 1.1 }], ['pause', { name: 'pause', k: 1 }], ['speak · one finger', { name: 'speak', k: 1 }], ['break-tusk', { name: 'break-tusk', k: 0.42 }], ['write · one tusk', { name: 'write', k: 1, phase: 2, tusk: 'broken' }]], lightPose: { name: 'write', k: 1 } },
    { id: 'vaishampayana', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['receive', { name: 'receive', k: 0.9 }], ['receive · holds', { name: 'receive', k: 1 }], ['bow', { name: 'bow', k: 1 }]], lightPose: 'stand' },
    // episodes 5–6 (Team B)
    { id: 'sarama', dx: 30, poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['run', { name: 'run', phase: 1.1 }], ['sit', 'sit'], ['speak · seated', { name: 'speak', base: 'sit', k: 1 }, { speak: 0.8 }], ['curse', { name: 'curse', k: 1 }, { mood: 'wrath', speak: 0.5 }], ['comfort', { name: 'comfort', k: 1 }]], lightPose: 'stand' },
    { id: 'pup', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['run', { name: 'run', phase: 1.1 }], ['sniff', { name: 'sniff', k: 1 }], ['cower', { name: 'cower', k: 1 }], ['sit', 'sit'], ['cry', { name: 'cry', k: 1 }]], lightPose: 'stand' },
    { id: 'prince', poses: [['Shrutasena · 0', 'stand', null, 'left', 0], ['Ugrasena · 1', 'stand', null, 'left', 1], ['Bhimasena · 2', 'stand', null, 'left', 2], ['sit · 0', 'sit', null, 'left', 0], ['raise · 1', { name: 'raise', k: 1 }, { mood: 'wrath' }, 'left', 1], ['strike · 2', { name: 'strike', k: 0.7 }, { mood: 'wrath' }, 'left', 2], ['point · 0', { name: 'point', k: 1 }, null, 'left', 0]], lightPose: 'stand' },
    { id: 'uttanka', poses: [['stand', 'stand'], ['run', { name: 'run', phase: 1.1 }], ['sit', 'sit'], ['bow', { name: 'bow', k: 1 }], ['point', { name: 'point', k: 1 }, { speak: 0.8 }], ['hold', { name: 'hold', k: 1 }], ['raise', { name: 'raise', k: 1 }], ['crouch · wrath', { name: 'crouch', k: 1 }, { mood: 'wrath' }]], lightPose: 'stand' },
    { id: 'queen', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['give', { name: 'give', k: 1 }], ['warn', { name: 'warn', k: 1, earrings: false }], ['bless', { name: 'bless', k: 1 }]], lightPose: 'stand' },
    { id: 'gurupatni', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['ask', { name: 'ask', k: 1 }], ['bless', { name: 'bless', k: 1 }]], lightPose: 'stand' },
    { id: 'takshaka', dx: -90, poses: [['stand', 'stand'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['strike', { name: 'strike', k: 1 }, { mood: 'wrath' }], ['recoil', { name: 'recoil', k: 1 }], ['give', { name: 'give', k: 1 }], ['dive', { name: 'dive', k: 0.5 }], ['guise · beggar', 'guise'], ['guise-run', { name: 'guise-run', phase: 1.1 }]], lightPose: 'stand' },
    // episode 7 (Astika parva)
    { id: 'parikshit', poses: [['stand', 'stand'], ['weary', { name: 'weary', phase: 1.1, k: 1 }], ['sit · throne', 'sit'], ['speak · ask', { name: 'speak', k: 1 }, { speak: 0.8 }], ['drape', { name: 'drape', k: 0.5 }, { mood: 'wrath' }], ['hold · fruit', { name: 'hold', k: 1 }], ['fall', { name: 'fall', k: 1 }]], lightPose: 'stand' },
    { id: 'shamika', poses: [['sit · meditate', 'sit'], ['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['grieve', { name: 'grieve', base: 'sit', k: 1 }], ['send', { name: 'send', base: 'sit', k: 1 }], ['bless', { name: 'bless', k: 1 }]], lightPose: 'sit' },
    { id: 'shringin', poses: [['stand', 'stand'], ['run', { name: 'run', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['scoop', { name: 'scoop', k: 1 }], ['curse · wrath', { name: 'curse', k: 1 }, { mood: 'wrath', speak: 0.8 }], ['point', { name: 'point', k: 1 }]], lightPose: 'stand' },
    // episode 8
    { id: 'priest', poses: [['Chandabhargava · 0', 'sit', null, 'left', 0], ['Kautsa · 1', 'stand', null, 'left', 1], ['Jaimini · 2', 'stand', null, 'left', 2], ['Sharngarava · 3', 'stand', null, 'left', 3], ['offer · 0', { name: 'offer', base: 'sit', k: 1, phase: 1 }, null, 'left', 0], ['chant · 1', { name: 'chant', k: 1 }, null, 'left', 1], ['chant · seated 2', { name: 'chant', base: 'sit', k: 1 }, null, 'left', 2]], lightPose: 'stand' },
    { id: 'indra', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit · cloud-throne', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['protect', { name: 'protect', k: 1 }], ['protect · throne', { name: 'protect', base: 'throne', k: 1 }], ['raise', { name: 'raise', k: 1 }, { mood: 'wrath' }]], lightPose: 'stand' },
    { id: 'sthapati', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['measure', { name: 'measure', k: 1 }], ['warn', { name: 'warn', k: 1 }, { speak: 0.8 }], ['warn · seated', { name: 'warn', base: 'sit', k: 1 }]], lightPose: 'stand' },
    // episodes 8–10 (Kadru and Vinata)
    { id: 'kadru', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['point · wager', { name: 'point', k: 1 }], ['curse · wrath', { name: 'curse', k: 1 }, { mood: 'wrath' }], ['cradle', { name: 'cradle', k: 1 }]], lightPose: 'stand' },
    { id: 'vinata', poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['sit', 'sit'], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['cradle', { name: 'cradle', k: 1 }], ['reach', { name: 'reach', k: 1 }], ['grieve', { name: 'grieve', k: 1 }], ['slave · bow', { name: 'bow', k: 1, slave: true }]], lightPose: 'stand' },
    { id: 'kashyapa', poses: [['sit', 'sit'], ['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['bless · seated', { name: 'bless', base: 'sit', k: 1 }], ['bless', { name: 'bless', k: 1 }]], lightPose: 'stand' },
    // episode 10
    { id: 'aruna', poses: [['stand', 'stand'], ['emerge', { name: 'emerge', k: 0.3 }], ['speak', { name: 'speak', k: 1 }, { speak: 0.8 }], ['curse · wrath', { name: 'curse', k: 1 }, { mood: 'wrath' }], ['point', { name: 'point', k: 1 }], ['rise', { name: 'rise', k: 1 }], ['rein', { name: 'rein', k: 1 }]], lightPose: 'stand' },
    { id: 'surya', frontal: true, poses: [['stand', 'stand', null, 'front']], lightPose: 'stand', lightFront: 0.6 },
    // episodes 11–16 (the churning of the ocean): the horse, Narayana, Brahma, the two hosts, the serpent kings, Mandara
    { id: 'horse', S: 0.2, poses: [['stand', 'stand'], ['walk', { name: 'walk', phase: 1.1 }], ['gallop', { name: 'gallop', phase: 0.6 }], ['rear', { name: 'rear', k: 1 }], ['bow', { name: 'bow', k: 1 }], ['tail · black hairs', { name: 'stand', tail: 1 }]], lightPose: 'stand', dx: 30 },
    { id: 'vishnu', frontal: true, S: 0.36, poses: [['stand', 'stand', null, 'front'], ['bless', { name: 'bless', k: 1 }, null, 'front'], ['speak', { name: 'speak', k: 1 }, null, 'front'], ['discus', { name: 'discus', k: 1 }, null, 'front']], lightPose: 'stand', lightFront: 0.5 },
    { id: 'brahma', frontal: true, S: 0.36, poses: [['sit', 'sit', null, 'front'], ['bless', { name: 'bless', k: 1 }, null, 'front'], ['speak', { name: 'speak', k: 1 }, null, 'front']], lightPose: 'sit', lightFront: 0.5 },
    { id: 'deva', poses: [['stand · 0', 'stand', null, 'left', 0], ['walk · 1', { name: 'walk', phase: 1.1 }, null, 'left', 1], ['pull · 2', { name: 'pull', k: 1 }, null, 'left', 2], ['raise · 3', { name: 'raise', k: 1 }, null, 'left', 3], ['point · 4', { name: 'point', k: 1 }, null, 'left', 4], ['bow · 5', { name: 'bow', k: 1 }, null, 'left', 5]], lightPose: 'stand' },
    { id: 'asura', poses: [['stand · 0', 'stand', null, 'left', 0], ['walk · 1', { name: 'walk', phase: 1.1 }, null, 'left', 1], ['pull · 2', { name: 'pull', k: 1 }, null, 'left', 2], ['raise · 3', { name: 'raise', k: 1 }, null, 'left', 3], ['strike · 4', { name: 'strike', k: 0.8 }, null, 'left', 4], ['cower · 5', { name: 'cower', k: 1 }, null, 'left', 5]], lightPose: 'stand' },
    { id: 'vasuki', S: 0.26, poses: [['rise', { name: 'rise', k: 1 }], ['coil', 'coil'], ['rise · fire', { name: 'rise', k: 1, fire: 1 }]], lightPose: 'rise' },
    { id: 'ananta', S: 0.24, poses: [['rise', { name: 'rise', k: 1 }], ['coil', 'coil']], lightPose: 'rise' },
    { id: 'mandara', frontal: true, S: 0.17, poses: [['stand', 'stand', null, 'front'], ['uprooted', { name: 'uprooted', k: 1 }, null, 'front'], ['churn · burn', { name: 'churn', k: 1, spin: 0.8, burn: 1 }, null, 'front']], lightPose: 'stand', lightFront: 0.4 },
  ];
  const LIGHTS = [['key · fire left', CH.LIGHTS.key], ['back · rim from behind', CH.LIGHTS.back], ['low · dim fire in front', CH.LIGHTS.low]];
  const NPOSE = Math.max(...ROWS.map((r) => r.poses.length));
  const W = LEFT + NPOSE * (CW + GAP) + 3 * (CW + GAP) + 40 + 40;
  const LINEUP_H = 700;
  const H = 120 + ROWS.length * (CH_ + HEAD + GAP) + LINEUP_H + 40;
  const cv = document.getElementById('sheet');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#120d0b'; ctx.fillRect(0, 0, W, H);
  const title = (t, x, y, size = 40, col = '#e7b54a', fam = 'display', w = 600, st = 'normal') => { ctx.save(); ctx.font = R.font(size, fam, w, st); ctx.fillStyle = col; ctx.fillText(t, x, y); ctx.restore(); };
  title('MAHABHARATAM · CHARACTER BIBLE', 40, 64, 44);
  title('one module per character · one draw(ctx, opts) · fixed design, palette, props and signature light · same scale for everyone', 40, 100, 22, '#9a8f7d', 'caption', 500, 'italic');

  function cell(x, y, w, h, light) {
    // a mural cell: plaster-dark ground, a hint of where the light is
    ctx.save();
    ctx.fillStyle = '#1c1410'; ctx.fillRect(x, y, w, h);
    if (light) {
      const lx = x + w / 2 + Math.cos(light.dir) * w * 0.62, ly = y + h * 0.55 + Math.sin(light.dir) * h * 0.5;
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      KIT.glow(ctx, lx, ly, w * 0.9, '#f08a24', 0.16 * light.intensity);
      ctx.fillStyle = '#ffcf7a'; ctx.globalAlpha = 0.8 * light.intensity;
      ctx.beginPath(); ctx.arc(R.clamp(lx, x + 12, x + w - 12), R.clamp(ly, y + 12, y + h - 12), 6, 0, R.TAU); ctx.fill();
    }
    ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(231,181,74,0.25)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); ctx.restore();
    // ground line
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, y + h - 34, w, 34); ctx.restore();
  }
  function label(t, x, y) { ctx.save(); ctx.font = R.font(19, 'caption', 600); ctx.fillStyle = '#d8c09a'; ctx.textAlign = 'center'; ctx.fillText(t, x, y); ctx.restore(); }

  let y = 130;
  for (const row of ROWS) {
    const mod = CH[row.id], b = mod.bible;
    title(b.name.toUpperCase(), 40, y + 36, 26);
    // left column: palette + light rule + voice
    const px = 40, py = y + HEAD;
    ctx.save();
    ctx.font = R.font(17, 'caption', 500); ctx.fillStyle = '#9a8f7d';
    const pal = Object.entries(b.palette);
    pal.forEach(([k, v], i) => {
      const cx = px + (i % 2) * 150, cy = py + 10 + Math.floor(i / 2) * 34;
      ctx.fillStyle = v; ctx.fillRect(cx, cy, 26, 26);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.strokeRect(cx + 0.5, cy + 0.5, 25, 25);
      ctx.fillStyle = '#c9b89a'; ctx.fillText(k, cx + 34, cy + 13); ctx.fillStyle = '#7d7262'; ctx.fillText(v, cx + 34, cy + 27);
    });
    const ty = py + 10 + Math.ceil(pal.length / 2) * 34 + 24;
    ctx.fillStyle = '#e7b54a'; ctx.font = R.font(17, 'caption', 600);
    const v = CAST[b.voice] || {};
    ctx.fillText(`voice ${v.voice} · ${v.speed}×${v.pitch ? ` · ${v.pitch > 0 ? '+' : ''}${v.pitch} st` : ''}  (${b.voice})`, px, ty);
    ctx.fillStyle = '#9a8f7d'; ctx.font = R.font(16, 'caption', 500, 'italic');
    // wrap the light rule
    const words = b.light.split(' '); let line = '', ly = ty + 26;
    for (const w of words) { if (ctx.measureText(line + w).width > LEFT - 60) { ctx.fillText(line, px, ly); ly += 20; line = ''; } line += w + ' '; }
    ctx.fillText(line, px, ly);
    ctx.restore();
    // poses
    row.poses.forEach(([lab, pose, ex, facing, index], i) => {
      const x = LEFT + i * (CW + GAP), cy = y + HEAD;
      const light = row.frontal ? { ...CH.LIGHTS.key, front: facing === 'back' ? 0 : (row.lightFront ?? 0.5) } : CH.LIGHTS.key;
      cell(x, cy, CW, CH_, light);
      ctx.save(); ctx.beginPath(); ctx.rect(x, cy, CW, CH_); ctx.clip();
      mod.draw(ctx, { x: x + CW / 2 + (row.frontal ? 0 : 20) + (row.dx || 0), y: cy + CH_ - 34, scale: row.S || S, pose, facing: facing || 'left', index: index ?? 0, expression: ex || {}, light, t: T0, key: `sheet` });
      ctx.restore();
      label(lab, x + CW / 2, cy + CH_ - 10);
    });
    // the same pose under three lights
    const lx0 = LEFT + NPOSE * (CW + GAP) + 40;
    LIGHTS.forEach(([lab, L], i) => {
      const x = lx0 + i * (CW + GAP), cy = y + HEAD;
      const light = row.frontal ? { ...L, front: Math.max(L.front, i === 0 ? row.lightFront ?? 0.5 : L.front) } : L;
      cell(x, cy, CW, CH_, light);
      ctx.save(); ctx.beginPath(); ctx.rect(x, cy, CW, CH_); ctx.clip();
      mod.draw(ctx, { x: x + CW / 2 + (row.frontal ? 0 : 20) + (row.dx || 0), y: cy + CH_ - 34, scale: row.S || S, pose: row.lightPose, facing: row.frontal ? 'front' : 'left', index: 0, light, t: T0, key: 'sheet' });
      ctx.restore();
      label(lab, x + CW / 2, cy + CH_ - 10);
    });
    if (row === ROWS[0]) title('THE SAME FIGURE UNDER THREE LIGHTS', lx0, y + 36, 20, '#9a8f7d');
    y += CH_ + HEAD + GAP;
  }

  // phone-size line-up: everyone at the size they would have in a wide shot on a phone
  y += 10;
  title('PHONE-SIZE LINE-UP (as on a 6-inch screen in a wide shot) · silhouettes must read at a glance', 40, y + 30, 22, '#e7b54a');
  const ly = y + 50, lh = LINEUP_H - 70;
  ctx.save(); ctx.fillStyle = '#0d0907'; ctx.fillRect(40, ly, W - 80, lh); ctx.restore();
  KIT.glow(ctx, W / 2, ly + lh + 60, 900, '#f08a24', 0.35, 'lighter', 0.4);
  const cast = [['sauti', 'stand', 'left'], ['elder', { name: 'speak', k: 1 }, 'left'], ['sage', 'sit', 'front', 2], ['sage', 'sit', 'front', 1], ['parashurama', { name: 'raise-axe', k: 1 }, 'left'], ['pitr', { name: 'bless', k: 1 }, 'front', 0], ['vyasa', 'stand', 'left'], ['janamejaya', 'stand', 'left'], ['sauti', 'sit', 'right'], ['parashurama', 'walk', 'right'], ['takshaka', 'stand', 'left'], ['sarama', 'stand', 'left'], ['pup', 'stand', 'left'], ['prince', 'stand', 'left', 2], ['uttanka', { name: 'walk', phase: 1.1 }, 'left'], ['queen', 'stand', 'left'], ['gurupatni', 'stand', 'left'], ['parikshit', 'stand', 'left'], ['shamika', 'stand', 'left'], ['shringin', 'stand', 'left'], ['priest', 'stand', 'left', 0], ['indra', 'stand', 'left'], ['sthapati', 'stand', 'left'], ['kadru', 'stand', 'left'], ['vinata', 'stand', 'left'], ['kashyapa', 'stand', 'left'], ['aruna', 'stand', 'left'], ['surya', 'stand', 'front'], ['vishnu', 'stand', 'front'], ['deva', 'stand', 'left', 1], ['asura', 'stand', 'left', 2]];
  const big = 0.3, small = 0.14;
  cast.forEach(([id, pose, facing, index], i) => {
    const x = 160 + i * ((W - 320) / (cast.length - 1));
    CH[id].draw(ctx, { x, y: ly + lh - 20, scale: big, pose, facing, index: index ?? 0, light: { dir: -Math.PI / 2 + (x < W / 2 ? 0.6 : -0.6), intensity: 0.9, front: 0.35 }, t: T0, key: 'lineup' });
  });
  // the same line-up again at true phone size, pure black on plaster, no light: does the shape alone read?
  ctx.save(); ctx.fillStyle = '#d8c09a'; ctx.fillRect(70, ly + 14, cast.length * 92 + 20, 176); ctx.restore();
  cast.forEach(([id, pose, facing, index], i) => {
    const x = 120 + i * 92;
    CH[id].shape(ctx, '#000', { x, y: ly + 150, scale: small * 0.8, pose, facing, index: index ?? 0, t: T0 });
  });
  ctx.save(); ctx.font = R.font(16, 'caption', 500, 'italic'); ctx.fillStyle = '#5a4a3a'; ctx.fillText('shape only, ≈ 110 px tall', 84, ly + 182); ctx.restore();
  window.__sheetReady = true;
})().catch((e) => { window.__sheetError = String(e && e.stack || e); });
</script>
