<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude — Motion Reel 2026</title>
<link rel="icon" href="data:,">
<meta name="description" content="A 15-second motion design showreel where every frame is generated from code.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink: #0B0B10; --paper: #F2EEE6; --signal: #FF4B1F; --mute: #8A8794; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050507; color: var(--paper); font-family: 'JetBrains Mono', ui-monospace, monospace; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .stage { flex: 1; display: grid; place-items: center; position: relative; min-height: 0; }
  canvas { display: block; background: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; transition: opacity .3s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay span { font: 700 14px/1 'JetBrains Mono', monospace; letter-spacing: .25em; padding: 18px 26px; border: 1.5px solid var(--paper); color: var(--paper); background: rgba(11,11,16,.35); backdrop-filter: blur(6px); }
  #overlay span::before { content: '▶'; margin-right: 14px; color: var(--signal); }
  .bar { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 22px; border-top: 1px solid #1c1c24; font-size: 12px; letter-spacing: .08em; }
  .bar button { background: none; border: 1px solid #2c2c36; color: var(--paper); font: inherit; padding: 7px 11px; cursor: pointer; border-radius: 2px; }
  .bar button:hover { border-color: var(--paper); }
  #play { width: 44px; color: var(--signal); }
  .track { position: relative; flex: 1; height: 30px; display: flex; align-items: center; }
  #scrub { width: 100%; accent-color: var(--signal); margin: 0; }
  #marks { position: absolute; left: 0; right: 0; top: -2px; height: 0; pointer-events: none; }
  .mark { position: absolute; transform: translate(-1px, -100%); pointer-events: auto; border: none !important; border-left: 1px solid var(--mute) !important; padding: 0 0 0 4px !important; font-size: 9px; color: var(--mute) !important; }
  .mark:hover { color: var(--paper) !important; }
  #time { color: var(--mute); min-width: 190px; text-align: right; font-variant-numeric: tabular-nums; }
  .keys { color: #4a4855; }
  body.render { background: var(--ink); }
  body.render .bar, body.render #overlay { display: none; }
  body.render canvas { box-shadow: none; }
  @media (max-width: 720px) { .keys, #loop { display: none; } #time { min-width: 0; } .bar { gap: 10px; padding: 0 12px; } }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="reel" aria-label="Claude motion reel"></canvas>
    <div id="overlay"><span>PLAY REEL</span></div>
  </div>
  <div class="bar">
    <button id="play" aria-label="Play or pause">▶</button>
    <div class="track"><div id="marks"></div><input id="scrub" type="range" min="0" max="1000" step="0.1" value="0" aria-label="Scrub"></div>
    <span id="time">00:00:00:00</span>
    <button id="mute">SOUND ON</button>
    <button id="loop">LOOP ON</button>
    <span class="keys">SPACE · ←/→ · 1–7</span>
  </div>

  <script src="src/engine.js"></script>
  <script src="src/scenes/s1-easing.js"></script>
  <script src="src/scenes/s2-type.js"></script>
  <script src="src/scenes/s3-shapes.js"></script>
  <script src="src/scenes/s4-particles.js"></script>
  <script src="src/scenes/s5-dimension.js"></script>
  <script src="src/scenes/s6a-montage.js"></script>
  <script src="src/scenes/s6b-montage.js"></script>
  <script src="src/scenes/s7-endcard.js"></script>
  <script src="src/runtime.js"></script>
</body>
</html>
